<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#070b14">

    <title>Snake Game - Mr Malik</title>

    <link rel="stylesheet" href="sn.css">
</head>

<body>

    <div class="game-app">

        <!-- ================= TOP BAR ================= -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    🐍
                </div>

                <div class="title-box">

                    <h1>Snake Game</h1>

                    <p id="modeText">
                        Wall Levels
                    </p>

                </div>

            </div>


            <!-- TOP BUTTONS — SAME -->

            <div class="top-buttons">

                <button
                    id="wallModeBtn"
                    class="active"
                    type="button">

                    🧱 Wall Levels

                </button>


                <button
                    id="freeModeBtn"
                    type="button">

                    ♾️ No Walls

                </button>


                <button
                    id="soundBtn"
                    type="button">

                    🔊 Sound ON

                </button>
                    <!-- THEME BUTTON -->

    <button
        id="themeBtn"
        type="button">

        🎨 Theme

    </button>

            </div>
            <!-- ================= THEME PANEL ================= -->

<div id="themePanel" class="theme-panel">

    <div class="theme-panel-header">

        <div>
            <span class="theme-panel-eyebrow">
                APPEARANCE
            </span>

            <h3>
                Choose Theme
            </h3>
        </div>

        <button
            id="closeThemeBtn"
            class="close-theme-btn"
            type="button">

            ✕

        </button>

    </div>


    <div class="theme-options">

        <button
            class="theme-option"
            data-theme="forest"
            type="button">

            <span class="theme-option-icon">
                🌲
            </span>

            <span class="theme-option-info">
                <strong>Forest</strong>
                <small>Emerald Forest</small>
            </span>

        </button>


        <button
            class="theme-option"
            data-theme="ocean"
            type="button">

            <span class="theme-option-icon">
                🌊
            </span>

            <span class="theme-option-info">
                <strong>Ocean</strong>
                <small>Ocean Storm</small>
            </span>

        </button>


        <button
            class="theme-option"
            data-theme="space"
            type="button">

            <span class="theme-option-icon">
                🌌
            </span>

            <span class="theme-option-info">
                <strong>Space</strong>
                <small>Purple Galaxy</small>
            </span>

        </button>


        <button
            class="theme-option"
            data-theme="volcano"
            type="button">

            <span class="theme-option-icon">
                🔥
            </span>

            <span class="theme-option-info">
                <strong>Volcano</strong>
                <small>Crimson Arena</small>
            </span>

        </button>


        <button
            class="theme-option"
            data-theme="frozen"
            type="button">

            <span class="theme-option-icon">
                ❄️
            </span>

            <span class="theme-option-info">
                <strong>Frozen</strong>
                <small>Ice World</small>
            </span>

        </button>

    </div>

</div>

        </header>


        <!-- ================= GAME CONTROLS ================= -->

        <section class="control-panel">

            <div class="panel-heading">

                <div>

                    <span class="panel-eyebrow">
                        GAME CONTROL
                    </span>

                    <h2>
                        Choose Your Challenge
                    </h2>

                </div>

                <div class="panel-status">
                    ● READY
                </div>

            </div>


            <div class="control-content">


                <!-- DIFFICULTY -->

                <div class="difficulty-area">

                    <div class="section-title">
                        <span>Difficulty</span>
                        <small>Select speed</small>
                    </div>


                    <div class="difficulty-controls">


                        <!-- EASY -->

                        <button
                            id="easyBtn"
                            class="difficulty-btn easy"
                            type="button">

                            <span class="difficulty-icon">
                                ◈
                            </span>

                            <span class="difficulty-info">

                                <strong>
                                    Easy
                                </strong>

                                <small>
                                    Relaxed
                                </small>

                            </span>

                        </button>


                        <!-- MEDIUM -->

                        <button
                            id="mediumBtn"
                            class="difficulty-btn medium"
                            type="button">

                            <span class="difficulty-icon">
                                ◆
                            </span>

                            <span class="difficulty-info">

                                <strong>
                                    Medium
                                </strong>

                                <small>
                                    Balanced
                                </small>

                            </span>

                        </button>


                        <!-- HARD -->

                        <button
                            id="hardBtn"
                            class="difficulty-btn hard"
                            type="button">

                            <span class="difficulty-icon">
                                ✦
                            </span>

                            <span class="difficulty-info">

                                <strong>
                                    Hard
                                </strong>

                                <small>
                                    Extreme
                                </small>

                            </span>

                        </button>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="actions-area">

                    <div class="section-title">
                        <span>Game</span>
                        <small>Manage game</small>
                    </div>


                    <div class="game-action-controls">

                        <button
                            id="pauseBtn"
                            class="game-action-btn pause-btn"
                            type="button">

                            <span class="action-icon">
                                ⏸
                            </span>

                            <span>
                                Pause
                            </span>

                        </button>


                        <button
                            id="restartBtn"
                            class="game-action-btn restart-btn"
                            type="button">

                            <span class="action-icon">
                                ↻
                            </span>

                            <span>
                                Restart
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- ================= STATS ================= -->

        <section class="game-info">

            <div class="info-box">

                <span>
                    SCORE
                </span>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="info-box">

                <span>
                    LEVEL
                </span>

                <strong id="level">
                    1
                </strong>

            </div>


            <div class="info-box">

                <span>
                    HIGH SCORE
                </span>

                <strong id="highScore">
                    0
                </strong>

            </div>


            <div class="info-box">

                <span>
                    LEVEL NAME
                </span>

                <strong id="levelName">
                    Beginner
                </strong>

            </div>

        </section>


        <!-- ================= BONUS ================= -->

        <section class="bonus-area">

            <div class="bonus-left">

                <span class="bonus-dot"></span>

                <span id="bonusStatus">
                    No Bonus
                </span>

            </div>


            <div id="bonusTimer">
                0
            </div>

        </section>


        <!-- ================= GAME ================= -->

                <main class="game-area">

            <canvas id="gameCanvas"></canvas>

            <!-- GAME MESSAGE -->

            <div
                id="messageBox"
                class="message-box">

                <div class="message-icon">
                    🐍
                </div>

                <h2 id="messageTitle">
                    Snake Game
                </h2>

                <p id="messageText">
                    Press Start Game to begin.
                </p>

                <button
                    id="startBtn"
                    type="button">

                    <span>▶</span>

                    Start Game

                </button>

            </div>

        </main>


        <!-- ================= MOBILE GAME CONTROLS ================= -->

        <div class="mobile-game-controls">

            <div class="dpad">

                <button
                    class="dpad-btn dpad-up"
                    data-dir="up"
                    aria-label="Move Up"
                    type="button">

                    <span>▲</span>

                </button>


                <button
                    class="dpad-btn dpad-left"
                    data-dir="left"
                    aria-label="Move Left"
                    type="button">

                    <span>◀</span>

                </button>


                <div class="dpad-center">
                    <span>🐍</span>
                </div>


                <button
                    class="dpad-btn dpad-right"
                    data-dir="right"
                    aria-label="Move Right"
                    type="button">

                    <span>▶</span>

                </button>


                <button
                    class="dpad-btn dpad-down"
                    data-dir="down"
                    aria-label="Move Down"
                    type="button">

                    <span>▼</span>

                </button>

            </div>


            <div class="mobile-control-label">
                SWIPE OR TAP TO MOVE
            </div>

        </div>

        </main>


        <!-- ================= FOOTER ================= -->

<!-- =========================
     GAME FOOTER
========================= -->

<footer class="game-footer">

    <span class="footer-line"></span>

    <div class="footer-content">

        <span class="footer-made">
            MADE BY
        </span>

        <span class="footer-brand">
            Mr. Malik!
        </span>

        <span class="footer-bicep">
            💪
        </span>

        <span class="footer-divider">
            •
        </span>

        <span class="footer-version">
            V2.00
        </span>

    </div>

    <span class="footer-line"></span>

</footer>

    </div>


    <!-- ================= MUSIC ================= -->

    <audio
        id="bgMusic"
        loop
        preload="auto">

        <source
            src="music.mp3"
            type="audio/mpeg">

    </audio>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="sn.js"></script>

</body>

</html>
